<ion-content [fullscreen]="true">
  <div class="registro-container">
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-back-button
            defaultHref="/login"
            text=""
            class="keda-back-btn">
            <ion-icon name="arrow-back"></ion-icon>
          </ion-back-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <div>
      <h1>Crea tu cuenta</h1>
      <p>Introduce tus datos para unirte a Keda</p>
    </div>

    <div class="formulario-registro">
      <ion-item lines="none" class="ion-margin-bottom">
        <ion-label position="stacked" [class.label-error]="errores.nombre">Nombre</ion-label>
        <ion-input [(ngModel)]="newUsuario.nombre" type="text" placeholder="Jane"
                   [class.input-error]="errores.nombre"
                   (ionInput)="errores.nombre = false">
          <ion-icon name="person" slot="start" [class.icon-error]="errores.nombre"></ion-icon>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="ion-margin-bottom">
        <ion-label position="stacked" [class.label-error]="errores.apellidos">Apellidos</ion-label>
        <ion-input [(ngModel)]="newUsuario.apellidos" type="text" placeholder="Doe Brown"
                   [class.input-error]="errores.apellidos"
                   (ionInput)="errores.apellidos = false">
          <ion-icon name="person" slot="start" [class.icon-error]="errores.apellidos"></ion-icon>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="ion-margin-bottom">
        <ion-label position="stacked" [class.label-error]="errores.email">Email</ion-label>
        <ion-input [(ngModel)]="newUsuario.email" type="email" placeholder="example@example.com"
                   [class.input-error]="errores.email"
                   (ionInput)="errores.email = false">
          <ion-icon name="mail" slot="start" [class.icon-error]="errores.email"></ion-icon>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="ion-margin-bottom">
        <ion-label position="stacked" class="ion-margin-bottom">Fecha Nacimiento</ion-label>
        <div class="keda-input-pill">
          <ion-icon name="calendar-outline"></ion-icon>
          <ion-datetime-button datetime="birthdate"></ion-datetime-button>
        </div>
      </ion-item>

      <ion-item lines="none" class="ion-margin-bottom">
        <ion-label position="stacked" [class.label-error]="errores.ciudad">Ciudad</ion-label>
        <ion-input [(ngModel)]="newUsuario.ciudad" type="text" placeholder="Valencia"
                   [class.input-error]="errores.ciudad"
                   (ionInput)="errores.ciudad = false">
          <ion-icon name="locate" slot="start" [class.icon-error]="errores.ciudad"></ion-icon>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="ion-margin-bottom keda-input-item">
        <ion-label position="stacked" [class.label-error]="errores.password">Password</ion-label>
        <ion-input
          type="password"
          placeholder="• • • • • • • •"
          [(ngModel)]="password"
          class="keda-custom-input"
          [class.input-error]="errores.password"
          (ionInput)="errores.password = false">
          <ion-icon name="lock-closed" slot="start" [class.icon-error]="errores.password"></ion-icon>
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="birthdate"
            presentation="date"
            [(ngModel)]="newUsuario.fechaNacimiento">
          </ion-datetime>
        </ng-template>
      </ion-modal>
    </div>

    <div>
      <ion-item lines="none" class="keda-terms-item">
        <ion-checkbox [checked]="aceptaTerminos" (ionChange)="toggleTerminos($event)" label-placement="end" justify="start">
          <ion-text class="terms-text">
            Acepto los <a href="/terms">términos y condiciones</a> y la
            <a href="/privacy">política de privacidad</a>.
          </ion-text>
        </ion-checkbox>
      </ion-item>
    </div>

    <div>
      <ion-button expand="block" (click)="registrar()" [disabled]="!aceptaTerminos">
        Registrarse
      </ion-button>
    </div>
  </div>
</ion-content>
